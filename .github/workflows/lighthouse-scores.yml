name: Lighthouse Scores

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

concurrency:
  group: lighthouse-scores-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci

      - name: Build static export (fallback target + LHCI budgets)
        run: npm run build

      - name: Run Lighthouse CI (production, then local out/ fallback)
        id: lhci
        run: |
          set -euo pipefail
          rm -rf .lighthouseci
          MODE=production
          if ! npx @lhci/cli@0.14.x autorun --config=lighthouserc.production.cjs 2>&1 | tee /tmp/lhci-output.txt; then
            echo "::warning::Production LHCI failed (often NO_FCP on hosted runners). Falling back to local out/ with the same assertMatrix."
            if grep -q 'NO_FCP' /tmp/lhci-output.txt 2>/dev/null; then
              echo "::notice::Detected NO_FCP against https://alexendros.me/ — measuring built out/ instead. Budgets unchanged."
            fi
            rm -rf .lighthouseci
            MODE=local
            npx @lhci/cli@0.14.x autorun --config=lighthouserc.cjs 2>&1 | tee /tmp/lhci-output.txt
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Extract scores from LHCI results
        id: scores
        run: node scripts/lhci-extract-scores.mjs

      - name: Print scores
        run: |
          echo "Mode:           ${{ steps.lhci.outputs.mode }}"
          echo "Performance:    ${{ steps.scores.outputs.perf }}%"
          echo "Accessibility:  ${{ steps.scores.outputs.a11y }}%"
          echo "Best Practices: ${{ steps.scores.outputs.bp }}%"
          echo "SEO:            ${{ steps.scores.outputs.seo }}%"
          echo ""
          echo "LHCI results uploaded to temporary-public-storage (see LHCI dashboard)."

      - name: Update Lighthouse badge gist (dynamic shields.io endpoint)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PERF: ${{ steps.scores.outputs.perf }}
          A11Y: ${{ steps.scores.outputs.a11y }}
          BP: ${{ steps.scores.outputs.bp }}
          SEO: ${{ steps.scores.outputs.seo }}
          GIST_ID: ${{ secrets.LH_GIST_ID }}
        with:
          script: |
            const perf = process.env.PERF;
            const a11y = process.env.A11Y;
            const bp = process.env.BP;
            const seo = process.env.SEO;
            const gistId = process.env.GIST_ID;

            const scoreColor = (s) => {
              const n = parseInt(s, 10);
              if (n >= 90) return '44cc11';
              if (n >= 50) return 'e67700';
              return 'd73a49';
            };

            const content = {
              schemaVersion: 1,
              label: 'lighthouse',
              message: `P:${perf}% A:${a11y}% BP:${bp}% SEO:${seo}%`,
              color: scoreColor(perf),
              cacheSeconds: 604800,
            };

            if (!gistId || gistId === '') {
              console.log('LH_GIST_ID not set — badge NOT updated.');
              console.log(`Scores: P:${perf}% A:${a11y}% BP:${bp}% SEO:${seo}%`);
              return;
            }

            try {
              const { data: gist } = await github.rest.gists.update({
                gist_id: gistId,
                files: {
                  'lighthouse.json': {
                    content: JSON.stringify(content, null, 2),
                  },
                },
              });

              const badgeUrl = `https://img.shields.io/endpoint?url=${encodeURIComponent(
                gist.files['lighthouse.json'].raw_url
              )}&logo=lighthouse&style=flat`;
              console.log(`Badge updated: ${badgeUrl}`);
            } catch (err) {
              console.error('Failed to update gist:', err.message);
              if (err.status === 404) {
                console.log('Gist not found. Verify LH_GIST_ID is correct.');
              }
            }
